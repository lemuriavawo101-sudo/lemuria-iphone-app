name: lemuria_telecaller_app
description: "Lemuria Varmam Clinic Mandatory Voice Telecaller & Lead Management Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  record: ^5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_feather_icons: ^2.0.0+1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: ^2.1.3
  record_platform_interface: ^2.1.0
  record_web: ^2.1.3
  path_provider_android: 2.2.10
  shared_preferences_android: 2.3.2

flutter:
  uses-material-design: true

