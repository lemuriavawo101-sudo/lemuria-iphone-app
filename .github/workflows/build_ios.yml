name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd lemuria_telecaller_app
          flutter pub get

      - name: Build iOS Application (.app)
        run: |
          cd lemuria_telecaller_app
          flutter build ios --release --no-codesign

      - name: Package into Installable IPA
        run: |
          cd lemuria_telecaller_app
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lemuria-telecaller.ipa Payload
          rm -rf Payload

      - name: Upload IPA Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemuria-telecaller-ipa
          path: lemuria_telecaller_app/lemuria-telecaller.ipa
          retention-days: 14
